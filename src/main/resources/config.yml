License-Key: "" # If you purchased it from MCModels it will be generated automatically, leave this blank.

Settings:
  lang: en
  interaction: RightClickEntity #LeftClick / LeftClickEntity / LeftClickPlayer / RightClick / RightClickEntity / RightClickPlayer / SwapHand
  exit: Sneak #Sneak / None
  hide-chat: true
  scroll-cooldown: 5
  command-cooldown: 5 # Don't touch if you don't know what you're doing

Output: # It'll still be created in the LuxDialogues/Output folder as raw state.
  pack-png: true
  mcmeta: true
  namespace: 'luxdialogues'
  save-to-directory: false
  file-name: 'LuxDialoguesOutput' # Name of the ZIP
  directory: ''

Hooks:
  CustomNameplates: false
  MMOCore: false
  AuraSkills: false
  FancyNPCs: false # It’s not required for interactions, only for the focus feature.
  Citizens: false # It’s not required for interactions, only for the focus feature.
  MythicMobs: false # It’s not required for interactions, only for the focus feature.

First-Install: true # Don't touch if you don't know what you're doing